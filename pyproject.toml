[project]
name = "ship-simulator"
version = "0.1.0"
description = "Autonomous vessel behavior simulator — MSTEM Capstone"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.7",
    "geopy>=2.4.1",
    "requests>=2.34.0",
    "pyshp>=3.0.3",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
